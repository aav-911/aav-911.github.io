<!doctype html>
<html lang="en">
  <head>
    <!-------- Loading Screen Stylesheet -------->
    <link rel="stylesheet" href="../css/loadingpage.css" />
    <!--------- General Stylesheet --------->
    <link rel="stylesheet" href="../css/general.css" />
    <!------- Projects Page Stylesheet ------->
    <link rel="stylesheet" href="../css/projects.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Abril Fatface"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!----- Page Title ----->
    <title>Mis Proyectos</title>
    <link rel="icon" href="../images/aav_logo.png" type="image/png" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav>
      <div class="logo"><a href="homepage.html">AAV</a></div>
      <div class="hamburger-menu" id="hamburger-menu">☰</div>
      <div class="nav-links" id="nav-links">
        <a href="paginaDeInicio.html">Inicio</a>
        <a href="misProyectos.html">Proyectos</a>
        <a href="acercaDeMi.html">Acerca de Mí</a>
        <a href="conectar.html">Conectar</a>
        <a href="../index.html">Idioma</a>
      </div>
    </nav>
    <!---- Main Content ---->
    <div class="page-content">
      <!--- Loading Screen --->
      <div class="loader"></div>
      <div class="scroll-container">
        <div class="panel section-intro">
          <!-- Projects Information -->
          <div class="container">
            <h1 data-typewriter-text="Mis Proyectos" data-typewriter-speed="70">
              Mis Proyectos
            </h1>
            <p>
              Aquí es donde puedes encontrar mis proyectos y aprender más sobre
              mi trabajo. Desplácese por cada categoría para explorar.
            </p>
          </div>
        </div>

        <!-- Computer Programming Section -->
        <div class="panel section-programming">
          <div class="carousel-wrapper">
            <button
              class="carousel-button left"
              data-carousel="programming-carousel"
            >
              ←
            </button>
            <div class="projects-carousel" id="programming-carousel">
              <div class="card loading">
                <div class="card-loader"></div>
              </div>
            </div>
            <button
              class="carousel-button right"
              data-carousel="programming-carousel"
            >
              →
            </button>
          </div>
        </div>

        <!-- Game Development Section -->
        <div class="panel section-gamedev">
          <div class="carousel-wrapper">
            <button
              class="carousel-button left"
              data-carousel="gamedev-carousel"
            >
              ←
            </button>
            <div class="projects-carousel" id="gamedev-carousel">
              <div class="card loading">
                <div class="card-loader"></div>
              </div>
            </div>
            <button
              class="carousel-button right"
              data-carousel="gamedev-carousel"
            >
              →
            </button>
          </div>
        </div>

        <!-- Music Section -->
        <div class="panel section-music">
          <div class="carousel-wrapper">
            <button class="carousel-button left" data-carousel="music-carousel">
              ←
            </button>
            <div class="projects-carousel" id="music-carousel">
              <div class="card loading">
                <div class="card-loader"></div>
              </div>
            </div>
            <button
              class="carousel-button right"
              data-carousel="music-carousel"
            >
              →
            </button>
          </div>
        </div>
      </div>
    </div>
    <div id="music-player-ui" class="music-player hidden">
      <div class="player-info">
        <span id="current-track-title"> No Track Selected </span>
      </div>

      <div class="player-controls">
        <button id="play-pause-btn" type="button">Play</button>
      </div>

      <div class="player-progress">
        <input
          type="range"
          id="progress-bar"
          value="0"
          min="0"
          max="100"
          aria-label="Track progress"
        />
      </div>

      <div class="player-time">
        <span id="current-time">0:00</span>
        /
        <span id="duration">0:00</span>
      </div>
    </div>

    <audio id="audio-player"></audio>
    <audio id="bg-music" src="../music/Website_Page.mp3" preload="auto"></audio>
    <script src="../js/script.js"></script>
    <script src="../js/typewriter.js"></script>
    <script src="../js/proyectos.js"></script>
  </body>
</html>
